<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}ComicCraft{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
{% set path = request.url.path %}
<nav>
  <a class="brand" href="/">ComicCraft</a>
  <div class="links">
    <a href="/" class="{{ 'active' if path == '/' }}">Create</a>
    <a href="/gallery" class="{{ 'active' if path == '/gallery' }}">Gallery</a>
    <a href="/about" class="{{ 'active' if path == '/about' }}">How it works</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>ComicCraft &middot; Stories by Google Gemini &middot; Art by Stable Diffusion</footer>
{% block scripts %}{% endblock %}
</body>
</html>
